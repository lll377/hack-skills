[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bionic-memory-system"
version = "1.0.0"
description = "A production-minded four-layer human-like memory service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psutil==7.2.2"]
license = { text = "MIT" }

[project.scripts]
bionic-memory = "memory_app.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["memory_app*"]

[tool.setuptools.package-data]
memory_app = ["static/*"]
